springdoc:
  # 禁用原本的 swagger-ui 页面
  swagger-ui:
    enabled: false
  # 开启 openapi 数据接口（Scalar 需要读取这个）
  api-docs:
    enabled: true
    path: /v3/api-docs


spring:
  data:
    redis:
      host: xlqs.com
      port: 6379
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0
    qdrant:
      host: xlqs.com
      port: 6334 # gRPC 默认端口是 6334，HTTP 默认是 6333
      api-key: Xlqsnhyq521.. # 如果配置了权限校验，没有则留空

